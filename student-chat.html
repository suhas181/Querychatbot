<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/img/logo.png" />
<title>Enquiry Chatbot — Student Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/student.css" />
<link rel="stylesheet" href="assets/css/motion.css" />
</head>
<body>

<div class="chat-page">

  <!-- =========================================================== HEADER -->
  <header class="chat-header">
    <a class="brand" href="index.html">
      <span class="crest"><img src="assets/img/logo.png" alt="" onerror="this.remove()" />SEA</span>
      <span class="brand-text">
        <span class="brand-name">College Enquiry Chatbot</span>
        <span class="brand-sub">SEA College of Engineering and Technology</span>
      </span>
    </a>

    <div class="chat-user">
      <div class="who">
        <span class="n" id="studentName">—</span>
        <span class="m" id="studentMeta">—</span>
      </div>
      <span class="avatar" id="studentAvatar">—</span>
      <button class="btn btn-on-dark btn-sm" type="button" id="logoutBtn">
        <span data-icon="logout"></span>
        <span class="btn-label">Logout</span>
      </button>
    </div>
  </header>

  <!-- ============================================================= CHAT -->
  <main class="chat-main">

    <div class="chat-scroll" id="chatScroll">
      <!-- Empty state / welcome, removed after the first question -->
      <div class="chat-welcome" id="chatWelcome">
        <div class="mark"><span data-icon="bot"></span></div>
        <h2>How can I help you today?</h2>
        <p>
          Ask me anything about the departments, faculty, class timings,
          facilities or contact details of the college.
        </p>
      </div>

      <div class="chat-thread" id="chatThread"
           role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>

    <div class="chat-composer-wrap">
      <form class="chat-composer" id="chatForm">
        <label class="visually-hidden" for="chatInput">Type your question</label>
        <textarea id="chatInput" rows="1"
                  placeholder="Ask a question about the college…"
                  autocomplete="off"></textarea>
        <button class="mic-btn" type="button" id="micBtn"
                title="Speak your question (Voice Input)" aria-label="Speak your question">
          <span data-icon="mic"></span>
        </button>
        <button class="send-btn" type="submit" id="sendBtn" disabled
                aria-label="Send question">
          <span data-icon="send"></span>
        </button>
      </form>

      <div class="composer-hint">
        <div class="voice-status-hint" id="voiceStatusHint">
          <span id="voiceStatusText"><kbd>Enter</kbd> to send · Click <kbd>🎤</kbd> to speak</span>
        </div>
        <button type="button" class="voice-mute-toggle active" id="voiceMuteToggle"
                title="Click to toggle automatic voice readout">
          <span class="voice-icon-wrap" id="voiceMuteIcon"></span>
          <span id="voiceMuteLabel">Voice answers: ON</span>
        </button>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/motion.js"></script>
</body>
</html>
